<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyric Stage</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/onboarding.css"></head><body><div id="welcome" role="status" aria-label="Welcome to Lyric Stage"><div class="welcome-content"><div class="welcome-record" aria-hidden="true"></div><div class="welcome-title">lyric stage</div><div class="welcome-loader" aria-hidden="true"></div></div></div>
<header><a class="brand" href="/">◉ <span>lyric stage</span></a><div class="search-shell"><form id="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><input id="query" aria-label="Search songs and artists" placeholder="Search songs or artists" autocomplete="off"><button type="submit">Search ↗</button><button id="closeSearch" type="button" aria-label="Close search results" hidden>×</button></form><section id="songsPanel" hidden aria-label="Song search results"><span id="count"></span><div class="section-heading"><h2 id="heading"></h2></div><div id="results" aria-live="polite"></div></section></div><button id="lyricsTab" class="lyrics-button" type="button">Lyrics ↗</button><button id="accountButton" type="button">Account</button></header>
<main><section class="player" aria-label="Music player"><div class="turntable"><div class="record" id="record"><div class="label"><img id="cover" alt="" hidden><span id="labelText">LYRIC<br>STAGE</span></div><div class="spindle"></div></div><div class="tonearm"><div></div></div></div><div class="song"><div><h1 id="title">Play a song</h1><p id="artist"></p></div></div><div class="timeline"><input id="seek" type="range" min="0" max="100" value="0" aria-label="Playback position" disabled><div><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div><div class="controls"><button id="previous" aria-label="Previous song">Ⅰ◀</button><button id="play" class="play" aria-label="Play" disabled>▶</button><button id="next" aria-label="Next song">▶Ⅰ</button><label class="volume">Volume <input id="volume" aria-label="Volume" type="range" min="0" max="1" step=".01" value=".8"></label></div><p id="playError" role="status"></p></section>
<aside><section id="lyricsPanel" hidden><div id="lyrics" aria-live="polite"><p>Play a song to see its lyrics.</p></div></section></aside></main><audio id="audio" preload="metadata"></audio><dialog id="usernameDialog" aria-labelledby="accountTitle"><div class="account-symbol" aria-hidden="true">◉</div><h2 id="accountTitle">What should we call you?</h2><p>Choose a username for your profile.</p><form id="usernameForm"><label for="username">Username</label><input id="username" name="username" autocomplete="nickname" minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]{3,24}" placeholder="your_name" required aria-describedby="accountNote accountError"><p id="accountNote" class="account-note">Your profile stays connected in this browser. A username is not a password.</p><p id="accountError" role="alert"></p><div class="account-actions"><button id="saveUsername" type="submit">Continue</button><button id="skipAccount" type="button">Continue as guest</button></div></form></dialog><script src="/app.js"></script><script type="module" src="/onboarding.bundle.js"></script></body></html>
